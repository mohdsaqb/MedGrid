server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: any path that isn't a real static file (e.g.
        # /patients/123) still serves index.html, so React Router can
        # handle the route client-side instead of nginx 404-ing on it.
        try_files $uri /index.html;
    }
}
